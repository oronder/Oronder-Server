name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: oronder_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check src tests

      - name: Run tests (fake Discord, no Foundry)
        env:
          ORONDER_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/oronder_test
          FAKE_DISCORD: "1"
        # tests/e2e auto-skips without a Foundry install
        run: uv run pytest tests/ -q
