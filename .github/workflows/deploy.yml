name: Build & Push container on push to main

on:
  push:
    branches: [ main ]
  workflow_dispatch: { }

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/oronder
  BACKUP_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/oronder-backup

jobs:
  build-and-push:
    # Set the RUNNER repository variable (e.g. "self-hosted") to build on your
    # own runner. Forks don't inherit repo variables, so they fall back to
    # GitHub's. Safe on a public repo only because this workflow never runs
    # on pull_request: a workflow that does must hardcode ubuntu-latest, or
    # fork PRs would execute on the self-hosted machine.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write  # allow pushing to GHCR with GITHUB_TOKEN

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # full history, so the changelog step can read this push's range
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Normalize owner to lowercase for GHCR
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=ghcr.io/${OWNER_LC}/oronder" >> $GITHUB_ENV
          echo "BACKUP_IMAGE_NAME=ghcr.io/${OWNER_LC}/oronder-backup" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.SHORT_SHA }}
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Build and push (backup)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./db_backup.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKUP_IMAGE_NAME }}:${{ steps.meta.outputs.SHORT_SHA }}
            ${{ env.BACKUP_IMAGE_NAME }}:main
            ${{ env.BACKUP_IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.BACKUP_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKUP_IMAGE_NAME }}:buildcache,mode=max

      # Announce what changed, as the bot, in the Discord changelog channel.
      # Needs the API_URL variable and the UPDATE_DISCORD_KEY secret; without
      # them the step prints why and does nothing.
      - name: Post changelog
        if: github.event_name == 'push'
        env:
          API_URL: ${{ vars.API_URL }}
          UPDATE_DISCORD_KEY: ${{ secrets.UPDATE_DISCORD_KEY }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 .github/workflows/post_changelog.py
