# Alembic configuration for CLI use (uv run alembic ...).
# The application runs migrations programmatically via database.init_db(),
# which does not read this file.

[alembic]
# Location of env.py and versions/, relative to this file.
script_location = %(here)s/alembic
path_separator = os

# The database URL is taken from the DATABASE_URL environment variable
# (see alembic/env.py). Uncomment to hardcode a fallback instead:
# sqlalchemy.url = postgresql://postgres@127.0.0.1:5432/oronder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
