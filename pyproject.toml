[project]
name = "oronder"
version = "0.0.1"
description = "Discord + FastAPI service for Oronder/Foundry integrations"
authors = [
    { name = "Tuna", email = "chris@oeleri.ch" }
]
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "aiohttp==3.14.3",
    "brotlipy==0.7.0",
    "d20==1.1.2",
    "dateparser==1.4.3",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "Jinja2==3.1.6",
    "markdownify==1.2.3",
    "msgspec==0.21.1",
    "numpy==2.5.3",
    "Pillow==12.3.0",
    "pip==26.2.1",
    "psutil==7.2.2",
    "psycopg2-binary==2.9.13",
    "py-cord==2.8.1",
    "pydantic==2.13.5",
    "python-socketio==5.17.0",
    "pytz==2026.3.post1",
    "pytzdata==2020.1",
    "setuptools==84.0.0",
    "SQLAlchemy==2.0.54",
    # Transitive via fastapi, but pinned here too, so `uv lock --upgrade` can't
    # move it: fastapi 0.141 accepts starlette <2, and 1.x already removed an
    # API we use.
    "starlette==1.6.0",
    #  "sqlmodel==0.0.24",
    "tabulate==0.10.0",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "mypy==2.3.1",
    "types-tabulate==0.10.0.20260508"
]
